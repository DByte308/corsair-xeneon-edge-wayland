[package]
name = "edgeline-desktop"
version = "0.7.0"
edition = "2024"
license = "GPL-3.0-or-later"
build = "build.rs"

[dependencies]
anyhow = "1"
gtk = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "process", "time"] }

[build-dependencies]
tauri-build = "2"
