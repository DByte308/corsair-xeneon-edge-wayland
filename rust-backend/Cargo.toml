[package]
name = "edgeline-backend"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Rust backend migration for EdgeLine's existing web UI"
default-run = "edgeline-backend"

[dependencies]
anyhow = "=1.0.98"
libc = "0.2"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
tokio = { version = "=1.45.0", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "process", "time"] }
uuid = "=1.16.0"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
