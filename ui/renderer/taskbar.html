<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:;">
<title>EdgeLine taskbar</title>
<link rel="stylesheet" href="taskbar.css">
</head>
<body>
<nav aria-label="Edge apps">
  <button id="home" class="fixed-button" title="Home" aria-label="Show Edge home screen"><span class="home-icon">⌂</span><span>Home</span></button>
  <button id="deck" class="fixed-button" title="Tablet Deck" aria-label="Show Tablet Deck"><span class="settings-icon">▦</span><span>Deck</span></button>
  <div class="divider"></div>
  <div id="apps" aria-label="Apps on the Edge"></div>
  <div id="connection" role="status"></div>
  <button id="settings" class="fixed-button" title="EdgeLine settings" aria-label="Show EdgeLine settings"><span class="settings-icon">⚙</span><span>Settings</span></button>
</nav>
<script src="taskbar.js"></script>
</body>
</html>
